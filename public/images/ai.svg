<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="400" y2="225" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1638"/>
      <stop offset="1" stop-color="#050b1f"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="225" fill="url(#bg)"/>
  <circle cx="315" cy="112" r="100" fill="url(#glow)"/>

  <!-- Chat window -->
  <rect x="20" y="20" width="210" height="185" rx="12" fill="#0f1a3a" stroke="#ffffff" stroke-opacity="0.12"/>
  <rect x="20" y="20" width="210" height="32" rx="12" fill="#16224a"/>
  <rect x="20" y="40" width="210" height="12" fill="#16224a"/>
  <circle cx="38" cy="36" r="9" fill="url(#grad)"/>
  <rect x="33" y="33" width="10" height="7" rx="2" stroke="#0b1638" stroke-width="1.4"/>
  <circle cx="36" cy="36.5" r="0.9" fill="#0b1638"/>
  <circle cx="40" cy="36.5" r="0.9" fill="#0b1638"/>
  <text x="53" y="34" font-family="Inter, Arial, sans-serif" font-size="8" font-weight="700" fill="#ffffff">AI туслах</text>
  <circle cx="55" cy="42.5" r="2" fill="#34d399"/>
  <text x="60" y="45" font-family="Inter, Arial, sans-serif" font-size="6" fill="#94a3b8">онлайн · 24/7</text>

  <!-- User message -->
  <rect x="102" y="62" width="116" height="22" rx="9" fill="#38bdf8"/>
  <text x="110" y="76" font-family="Inter, Arial, sans-serif" font-size="7.5" fill="#0b1638">Захиалга маань хаана явна?</text>

  <!-- Bot message -->
  <rect x="32" y="92" width="150" height="34" rx="9" fill="#ffffff" fill-opacity="0.08"/>
  <text x="40" y="105" font-family="Inter, Arial, sans-serif" font-size="7.5" fill="#e2e8f0">Таны #1024 захиалга замдаа</text>
  <text x="40" y="117" font-family="Inter, Arial, sans-serif" font-size="7.5" fill="#e2e8f0">явж байна. Өнөөдөр хүргэнэ.</text>

  <!-- Bot typing -->
  <rect x="32" y="134" width="40" height="18" rx="9" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="44" cy="143" r="2.5" fill="#94a3b8"/>
  <circle cx="52" cy="143" r="2.5" fill="#94a3b8" fill-opacity="0.7"/>
  <circle cx="60" cy="143" r="2.5" fill="#94a3b8" fill-opacity="0.4"/>

  <!-- Input -->
  <rect x="30" y="172" width="190" height="22" rx="11" fill="#0b1638" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="42" y="186" font-family="Inter, Arial, sans-serif" font-size="7" fill="#64748b">Асуултаа бичнэ үү...</text>
  <circle cx="208" cy="183" r="8" fill="url(#grad)"/>
  <path d="M205 183h6M208.5 180.5l2.5 2.5-2.5 2.5" stroke="#0b1638" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Neural network -->
  <g stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1">
    <path d="M262 60L312 45M262 60L312 85M262 60L312 125M262 60L312 165"/>
    <path d="M262 112L312 45M262 112L312 85M262 112L312 125M262 112L312 165"/>
    <path d="M262 164L312 45M262 164L312 85M262 164L312 125M262 164L312 165"/>
    <path d="M312 45L362 85M312 85L362 85M312 125L362 85M312 165L362 85"/>
    <path d="M312 45L362 140M312 85L362 140M312 125L362 140M312 165L362 140"/>
  </g>
  <g stroke="#818cf8" stroke-width="1.8" stroke-opacity="0.9">
    <path d="M262 112L312 85L362 85"/>
    <path d="M262 60L312 125L362 140"/>
  </g>
  <g>
    <circle cx="262" cy="60" r="8" fill="#0f1a3a" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="262" cy="112" r="8" fill="#38bdf8"/>
    <circle cx="262" cy="164" r="8" fill="#0f1a3a" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="312" cy="45" r="8" fill="#0f1a3a" stroke="#818cf8" stroke-width="2"/>
    <circle cx="312" cy="85" r="8" fill="#818cf8"/>
    <circle cx="312" cy="125" r="8" fill="#818cf8"/>
    <circle cx="312" cy="165" r="8" fill="#0f1a3a" stroke="#818cf8" stroke-width="2"/>
    <circle cx="362" cy="85" r="10" fill="url(#grad)"/>
    <circle cx="362" cy="140" r="10" fill="url(#grad)"/>
  </g>
  <text x="312" y="200" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="8" font-weight="600" fill="#94a3b8" letter-spacing="1">MACHINE LEARNING</text>
</svg>
