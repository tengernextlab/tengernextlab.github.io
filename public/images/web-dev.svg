<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="400" y2="225" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1638"/>
      <stop offset="1" stop-color="#050b1f"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="screen"><rect x="20" y="16" width="360" height="209" rx="10"/></clipPath>
  </defs>

  <rect width="400" height="225" fill="url(#bg)"/>
  <circle cx="330" cy="40" r="90" fill="url(#glow)"/>

  <!-- Browser window -->
  <g clip-path="url(#screen)">
    <rect x="20" y="16" width="360" height="209" rx="10" fill="#0f1a3a" stroke="#ffffff" stroke-opacity="0.12"/>
    <!-- Title bar -->
    <rect x="20" y="16" width="360" height="22" fill="#16224a"/>
    <circle cx="33" cy="27" r="3.5" fill="#f87171"/>
    <circle cx="44" cy="27" r="3.5" fill="#fbbf24"/>
    <circle cx="55" cy="27" r="3.5" fill="#34d399"/>
    <rect x="120" y="21" width="160" height="12" rx="6" fill="#0b1638"/>
    <text x="200" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#94a3b8">tengernextlab.mn</text>

    <!-- Nav -->
    <rect x="34" y="48" width="10" height="10" rx="3" fill="url(#grad)"/>
    <rect x="48" y="51" width="44" height="4" rx="2" fill="#e2e8f0"/>
    <rect x="232" y="51" width="22" height="4" rx="2" fill="#64748b"/>
    <rect x="260" y="51" width="22" height="4" rx="2" fill="#64748b"/>
    <rect x="288" y="51" width="22" height="4" rx="2" fill="#64748b"/>
    <rect x="320" y="47" width="46" height="12" rx="6" fill="#38bdf8"/>

    <!-- Hero text -->
    <rect x="34" y="78" width="130" height="9" rx="4" fill="#ffffff"/>
    <rect x="34" y="92" width="110" height="9" rx="4" fill="url(#grad)"/>
    <rect x="34" y="110" width="140" height="4" rx="2" fill="#64748b"/>
    <rect x="34" y="118" width="120" height="4" rx="2" fill="#64748b"/>
    <rect x="34" y="132" width="54" height="15" rx="7.5" fill="url(#grad)"/>
    <rect x="94" y="132" width="54" height="15" rx="7.5" stroke="#ffffff" stroke-opacity="0.25"/>

    <!-- Hero visual: dashboard chart -->
    <rect x="214" y="72" width="152" height="80" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <rect x="224" y="82" width="40" height="4" rx="2" fill="#94a3b8"/>
    <rect x="224" y="90" width="26" height="7" rx="2" fill="#ffffff"/>
    <path d="M224 140 L244 128 L262 133 L282 115 L302 120 L322 100 L342 106 L356 90" stroke="url(#grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M224 140 L244 128 L262 133 L282 115 L302 120 L322 100 L342 106 L356 90 L356 146 L224 146 Z" fill="#38bdf8" fill-opacity="0.1"/>
    <circle cx="356" cy="90" r="3.5" fill="#818cf8"/>

    <!-- Feature cards -->
    <g>
      <rect x="34" y="164" width="104" height="48" rx="7" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
      <rect x="42" y="172" width="12" height="12" rx="3" fill="#38bdf8" fill-opacity="0.3"/>
      <rect x="42" y="190" width="56" height="4" rx="2" fill="#e2e8f0"/>
      <rect x="42" y="199" width="80" height="3" rx="1.5" fill="#64748b"/>

      <rect x="148" y="164" width="104" height="48" rx="7" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
      <rect x="156" y="172" width="12" height="12" rx="3" fill="#818cf8" fill-opacity="0.35"/>
      <rect x="156" y="190" width="50" height="4" rx="2" fill="#e2e8f0"/>
      <rect x="156" y="199" width="78" height="3" rx="1.5" fill="#64748b"/>

      <rect x="262" y="164" width="104" height="48" rx="7" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
      <rect x="270" y="172" width="12" height="12" rx="3" fill="#34d399" fill-opacity="0.3"/>
      <rect x="270" y="190" width="60" height="4" rx="2" fill="#e2e8f0"/>
      <rect x="270" y="199" width="74" height="3" rx="1.5" fill="#64748b"/>
    </g>
  </g>
</svg>
